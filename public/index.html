<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kickball · Sydney Summer 2026 Schedule — Season 17</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./assets/index-04a01f6d.js"></script>
    <link rel="stylesheet" href="./assets/index-0013d1ab.css" />
  </head>
  <body data-template-id="__page-root" class="min-h-screen flex flex-col bg-slate-50">
    <!-- Season Header -->
    <header class="season-page-header w-full border-b border-slate-200/90 px-4 py-4 md:py-5">
      <div class="max-w-5xl mx-auto season-header-grid">
        <div class="season-title-icon-wrap hidden sm:flex shrink-0" aria-hidden="true">
          <div class="season-title-icon">
            <i
              data-lucide="calendar-days"
              class="text-indigo-600"
              style="width: 22px; height: 22px"
            ></i>
          </div>
        </div>
        <p class="season-kicker">Sydney Summer 2026</p>
        <h1 data-template-id="season-title" class="season-title">
          <span class="season-title-words"
            ><span class="season-title-brand">Kickball</span
            ><span class="season-title-sep" aria-hidden="true">·</span
            ><span class="season-title-rest">Schedule</span></span
          ><span class="season-badge">Season 17</span>
        </h1>
      </div>
    </header>
    <!-- Team Selector Bar -->
    <nav
      class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/90"
      id="team-selector-bar"
      aria-label="Team schedule filter"
    >
      <div class="max-w-5xl mx-auto px-4 py-2.5 md:py-3">
        <p
          id="team-filter-heading"
          data-template-id="selector-label"
          class="block text-[0.65rem] font-semibold uppercase tracking-[0.14em] text-slate-400 mb-2"
        >
          Filter by team
        </p>
        <div
          class="team-pills-panel p-2 md:p-2.5 team-pills-desktop"
          id="team-pills-wrap"
          role="group"
          aria-labelledby="team-filter-heading"
        >
          <div class="team-pills-grid" id="team-pills"></div>
        </div>
        <div class="team-dropdown-mobile hidden">
          <select
            id="team-dropdown"
            class="w-full min-h-[2.75rem] border border-slate-200 rounded-lg px-3 py-2 text-sm font-semibold bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            onchange="selectTeamFromDropdown(this.value)"
            aria-label="Choose a team to filter the schedule"
          ></select>
        </div>
      </div>
    </nav>
    <!-- Team Summary Panel -->
    <div id="team-summary" class="hidden w-full max-w-5xl mx-auto px-4 mt-4">
      <div class="summary-panel w-full rounded-xl p-4 pt-5">
        <p class="text-[0.65rem] font-bold uppercase tracking-[0.2em] text-slate-500 mb-1.5">
          Your team
        </p>
        <h2 id="summary-team-name" class="text-lg font-bold mb-3"></h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm text-slate-700">
          <div class="rounded-lg bg-white/60 px-3 py-2 border border-slate-200/80">
            <span class="font-semibold text-slate-600">Field Setup:</span>
            <span id="summary-setup">—</span>
          </div>
          <div class="rounded-lg bg-white/60 px-3 py-2 border border-slate-200/80">
            <span class="font-semibold text-slate-600">Pack Down:</span>
            <span id="summary-packdown">—</span>
          </div>
        </div>
      </div>
    </div>
    <!-- View Toggle (only visible when team selected) -->
    <div
      id="view-toggle-container"
      class="hidden max-w-5xl mx-auto px-4 py-3 flex justify-between items-center"
    >
      <span class="text-sm font-semibold text-slate-700">View:</span>
      <div class="flex gap-2">
        <button
          id="view-detailed-btn"
          class="px-4 py-2 rounded-lg text-sm font-semibold bg-white border-2 border-slate-200 text-slate-700 cursor-pointer hover:border-slate-300"
          onclick="switchView('detailed')"
        >
          Detailed
        </button>
        <button
          id="view-simplified-btn"
          class="px-4 py-2 rounded-lg text-sm font-semibold bg-white border-2 border-slate-200 text-slate-700 cursor-pointer hover:border-slate-300"
          onclick="switchView('simplified')"
        >
          Simplified
        </button>
      </div>
    </div>
    <!-- Game Cards -->
    <main class="flex-1 w-full max-w-5xl mx-auto px-4 pt-4 pb-8" id="game-cards"></main>
    <footer
      data-template-id="footer-section"
      class="bg-white text-center py-4 border-t border-slate-100"
    >
      <p data-template-id="footer-text" class="text-xs text-slate-400"></p>
      <p
        data-template-id="footer-credit"
        class="text-xs text-slate-400 mt-2 inline-flex items-center justify-center gap-1 flex-wrap"
      >
        Made with
        <i data-lucide="heart" class="text-red-500 shrink-0" style="width: 12px; height: 12px"></i>
        by Marcelo Camargo
      </p>
    </footer>
  </body>
</html>
